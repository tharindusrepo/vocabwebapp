<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-yellow-200 font-sans flex flex-col items-center">

    <!-- Global Header -->
    <div class="text-center mt-8 mb-8"> <!-- Added mb-8 for spacing -->
        <h1 class="text-4xl font-bold text-gray-800">English Lab</h1>
        <p class="text-sm text-gray-600">by Tharindu K. Jayasinghe</p>
        <!-- Home button could go here if desired globally, e.g.,
        <button id="home-button-global" class="mt-2 text-sm text-blue-600 hover:underline">Main Menu</button> 
        For now, let's rely on browser back or future explicit nav buttons within views.
        -->
    </div>

    <!-- Main Application Views Container -->
    <div id="app-views-container" class="flex-1 flex flex-col items-center w-full">

        <!-- Main Menu View - DELETED -->

        <!-- Flashcard View (Initially Hidden) -->
        <div id="flashcard-view" class="hidden flex-1 flex flex-col items-center p-6 w-full max-w-md">
            <!-- Search Bar -->
            <div class="mb-6 w-full">
                <input id="search-input" type="text" placeholder="Search for a word" class="w-full p-3 border border-gray-300 rounded-full focus:outline-none focus:ring-2 focus:ring-yellow-400 text-center">
            </div>

            <!-- Flashcard Section -->
            <div id="flashcard-perspective-container" class="bg-white p-6 rounded-lg shadow-lg w-full">
                <div id="flashcard-interactive-area" class="relative bg-yellow-100 rounded-lg p-12 text-center min-h-[100px] flex justify-center items-center">
                    <div id="flashcard-content" class="absolute inset-0 flex flex-col justify-center items-center text-center text-2xl font-semibold text-gray-800">
                        <!-- JS populates inner H2 here -->
                    </div>
                    <div id="flashcard-translation" class="absolute inset-0 flex flex-col justify-center items-center text-center rounded-lg text-2xl font-semibold text-gray-800 bg-gray-100"> 
                        <!-- JS populates inner H2 here -->
                    </div>
                </div>
                <p id="progress-text" class="text-center text-gray-600 mt-4">Word X of Y</p>
                <div class="flex justify-between mt-6">
                    <button id="prev-button" class="bg-gray-300 text-gray-800 px-6 py-2 rounded-full hover:bg-gray-400 transition">Previous</button>
                    <button id="next-button" class="bg-gray-300 text-gray-800 px-6 py-2 rounded-full hover:bg-gray-400 transition">Next</button>
                </div>
                <!-- "Start Quiz" and "Sentence Practice" buttons are REMOVED from here as per plan -->
            </div>
            <div class="mode-start-buttons-container mt-6">
                <button id="start-quiz-button" class="w-full px-4 bg-yellow-400 text-gray-800 py-3 rounded-full hover:bg-yellow-500 transition font-semibold mb-4 text-base">Sight Words Quiz</button>
                <button id="start-sentence-button" class="w-full px-4 bg-black text-white py-3 rounded-full hover:bg-gray-800 transition font-semibold text-base">Sentence Practice</button>
            </div>
            <!-- <button id="back-to-menu-flashcards" class="mt-6 bg-gray-200 text-gray-700 px-6 py-2 rounded-full hover:bg-gray-300 transition">Back to Main Menu</button> DELETED -->
        </div>

        <!-- Quiz View (Initially Hidden - Placeholder) -->
        <div id="quiz-view" class="hidden flex-1 flex flex-col items-center p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-4">Quiz Mode</h2>
            <p class="mb-4">Quiz content will go here...</p>
            <!-- Quiz UI will be built/adapted here later -->
            <button id="back-to-flashcards-quiz" class="mt-6 bg-gray-200 text-gray-700 px-6 py-2 rounded-full hover:bg-gray-300 transition">Back to Flashcards</button>
        </div>

        <!-- Sentence Practice View (Initially Hidden - Placeholder) -->
        <div id="sentence-practice-view" class="hidden flex-1 flex flex-col items-center p-6 w-full max-w-md">
            <h2 class="text-2xl font-bold mb-4">Sentence Practice</h2>
            <p class="mb-4">Sentence practice content will go here...</p>
            <!-- Sentence Practice UI will be built/adapted here later -->
            <button id="back-to-flashcards-sentence" class="mt-6 bg-gray-200 text-gray-700 px-6 py-2 rounded-full hover:bg-gray-300 transition">Back to Flashcards</button>
        </div>

    </div> <!-- End of #app-views-container -->

    <!-- Global Footer -->
    <div class="text-center mb-8 mt-auto pt-6"> <!-- mt-auto to push footer down, pt-6 for spacing -->
        <p class="text-gray-600 mb-2">For more games, quizzes and other learning materials click here.</p>
        <button id="footer-action-button" class="bg-black text-white px-6 py-2 rounded-full hover:bg-gray-800 transition">Click here</button>
        <p class="text-gray-500 mt-4 text-sm">© Tharindu K. Jayasinghe | Version 1.0 | 2025</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
